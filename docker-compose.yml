version: "3.9"

services:
  leader:
    build: .
    container_name: kv-leader
    depends_on:
      follower1:
        condition: service_healthy
      follower2:
        condition: service_healthy
      follower3:
        condition: service_healthy
      follower4:
        condition: service_healthy
      follower5:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      ROLE: leader
      NODE_ID: leader
      HOST: 0.0.0.0
      PORT: 8000
      FOLLOWER_URLS: "http://follower1:8000,http://follower2:8000,http://follower3:8000,http://follower4:8000,http://follower5:8000"
      WRITE_QUORUM: "${WRITE_QUORUM:-3}"
      MIN_DELAY_MS: "${MIN_DELAY_MS:-0}"
      MAX_DELAY_MS: "${MAX_DELAY_MS:-1000}"
      REPLICATE_TIMEOUT_SECONDS: "${REPLICATE_TIMEOUT_SECONDS:-5}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 2s
      retries: 5

  follower1:
    build: .
    container_name: kv-follower1
    ports:
      - "8101:8000"
    environment:
      ROLE: follower
      NODE_ID: follower1
      HOST: 0.0.0.0
      PORT: 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 2s
      retries: 5

  follower2:
